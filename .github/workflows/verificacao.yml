name: Verificação reproduzível

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificacao-basica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar verificações sem dataset ou GPU
        run: python scripts/verificar_reproducibilidade.py
